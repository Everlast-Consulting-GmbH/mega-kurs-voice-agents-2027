      'Datumsangaben: "2026-10-20", "20.10.2026", "heute", "morgen". Alle Methoden liefern {ok:true, …} oder {ok:false, code, error}.'
    ];
  },
  getHotel(){ return {ok:true, hotel: clone(S.hotel), today: todayISO(), rooms: S.rooms.length}; },
  listCategories(){ return {ok:true, categories: CATEGORIES.map(c => ({code:c.code, name:c.name, sizeSqm:c.size, maxGuests:c.maxGuests, maxAdults:c.maxAdults, beds:c.beds, features:c.features, rooms: S.rooms.filter(r => r.category === c.code).length}))}; },
  listRatePlans(){ return {ok:true, ratePlans: clone(S.ratePlans)}; },
  checkAvailability(o){
    return apiRun(false, () => {
      const st = apiStay(o); const cat = catCode(o && o.category);
      if (!st.arrival) return fail('INVALID_ARRIVAL', 'Bitte ein gültiges Anreisedatum angeben.');
      if (!st.departure || st.departure <= st.arrival) return fail('INVALID_DEPARTURE', 'Bitte ein gültiges Abreisedatum nach der Anreise angeben.');
      if (cat && !CAT[cat]) return fail('INVALID_CATEGORY', 'Unbekannte Kategorie. Erlaubt: ' + CATEGORIES.map(c => c.code + ' (' + c.name + ')').join(', '));
      const pers = st.adults + st.children;
      const cats = CATEGORIES.filter(c => !cat || c.code === cat).map(c => {
        const free = freeRooms(c.code, st.arrival, st.departure);
        const fits = pers <= c.maxGuests && st.adults <= c.maxAdults;
        return {category:c.code, name:c.name, maxGuests:c.maxGuests, fitsGuests:fits, freeRooms: free.length, available: fits && free.length > 0, roomNumbers: free.map(r => r.no),
          prices: fits ? S.ratePlans.map(p => { const qq = quote({category:c.code, ratePlan:p.code, arrival:st.arrival, departure:st.departure, adults:st.adults, children:st.children}); return {ratePlan:p.code, name:p.name, total:qq.total, avgPerNight:qq.avgRate, policy:p.policy}; }) : []};
      });
      return {ok:true, arrival:st.arrival, departure:st.departure, nights: diffDays(st.arrival, st.departure), adults:st.adults, children:st.children, available: cats.some(c => c.available), categories: cats};
    });
  },
  getRates(o){
    return apiRun(false, () => {
      const st = apiStay(o); const cat = catCode(o && o.category); const pc = planCode(o && o.ratePlan);
      const v = validateStay({arrival:st.arrival, departure:st.departure, category:cat, adults:st.adults, children:st.children, ratePlan:pc});
      if (!v.ok && v.code !== 'NO_AVAILABILITY') return v;
      const qq = quote({category:cat, ratePlan:pc, arrival:st.arrival, departure:st.departure, adults:st.adults, children:st.children, extras:o.extras, cityTaxExempt:o.cityTaxExempt});
      return {ok:true, category:cat, categoryName:CAT[cat].name, ratePlan:pc, ratePlanName:plan(pc).name, policy:plan(pc).policy, arrival:st.arrival, departure:st.departure, nights:qq.nights, nightly:qq.nightly, lines:qq.lines.map(l => ({desc:l.desc, qty:l.qty, unit:l.unit, vat:l.vat, total:l.total})), total:qq.total, available: v.ok};
    });
  },
  createReservation(o){
    return apiRun(true, () => {
      o = o || {};
      const st = apiStay(o);
      const g = o.guest || {firstName:o.firstName, lastName:o.lastName || (o.name && String(o.name).trim().split(/\s+/).slice(-1)[0]), phone:o.phone, email:o.email, salutation:o.salutation, company:o.company, city:o.city, country:o.country};
      if (!g.firstName && o.name && String(o.name).trim().split(/\s+/).length > 1) g.firstName = String(o.name).trim().split(/\s+/).slice(0, -1).join(' ');
      const x = createReservationCore({guestId:o.guestId, guest:g, arrival:st.arrival, departure:st.departure, adults:st.adults, children:st.children, category:catCode(o.category), roomNo:o.roomNo, ratePlan:planCode(o.ratePlan), extras:o.extras, cityTaxExempt:o.cityTaxExempt, channel:o.channel || 'Voice Agent', status:o.status, optionUntil:o.optionUntil, notes:o.notes});
      if (!x.ok) return x;
      toast('Neue Reservierung ' + x.reservation.id + ' (API)', 'info', guestFull(guest(x.reservation.guestId)) + ', ' + fmtDate(x.reservation.arrival) + '–' + fmtDate(x.reservation.departure));
      return {ok:true, reservation: resDTO(x.reservation)};
    });
  },
  findReservation(query){
    return apiRun(false, () => {
      if (query && typeof query === 'object'){ const list = resFilter({q: query.name || query.phone || query.email || query.id || '', status: query.status || ''}); return {ok:true, count:list.length, reservations: list.slice(0, 20).map(resDTO)}; }
      const r = searchAll(String(query || ''), 20);
      const rooms = /^\d{3}$/.test(String(query).trim()) ? S.reservations.filter(x => x.roomNo === String(query).trim() && ['option','bestaetigt','angereist'].includes(x.status)) : [];
      const all = r.reservations.concat(rooms.filter(x => !r.reservations.includes(x)));
      return {ok:true, count: all.length, reservations: all.map(resDTO)};
    });
  },
  getReservation(id){ const r = resv(id); return r ? {ok:true, reservation: Object.assign(resDTO(r), {folio: folioOf(r).lines.map(l => ({desc:l.desc, qty:l.qty, unit:l.unit, vat:l.vat, total:l.total})), payments: clone(r.payments)})} : fail('RESERVATION_NOT_FOUND', 'Reservierung ' + id + ' nicht gefunden.'); },
  updateReservation(id, patch){
    return apiRun(true, () => {
      patch = patch || {};
      const p = {};
      if (patch.from || patch.arrival) p.arrival = normDate(patch.from || patch.arrival);
      if (patch.to || patch.departure) p.departure = normDate(patch.to || patch.departure);
      ['adults','children','roomNo','extras','notes','channel','cityTaxExempt','status','optionUntil','guestId'].forEach(k => { if (patch[k] !== undefined) p[k] = patch[k]; });
      if (patch.category) p.category = catCode(patch.category);
      if (patch.ratePlan) p.ratePlan = planCode(patch.ratePlan);
      const x = updateReservationCore(id, p); if (!x.ok) return x;
      return {ok:true, changes:x.changes, reservation: resDTO(x.reservation)};
    });
  },
  addNote(id, text){ return apiRun(true, () => { const r = resv(id); if (!r) return fail('RESERVATION_NOT_FOUND', 'Reservierung ' + id + ' nicht gefunden.'); const t = String(text || '').trim(); if (!t) return fail('EMPTY_NOTE', 'Bitte einen Text angeben.'); const x = updateReservationCore(r.id, {notes: (r.notes ? r.notes + '\n' : '') + t}); return x.ok ? {ok:true, reservation: resDTO(x.reservation)} : x; }); },
  cancelReservation(id, reason){ return apiRun(true, () => { const x = cancelReservationCore(id, reason || 'Storniert über Voice Agent'); return x.ok ? {ok:true, reservation: resDTO(x.reservation)} : x; }); },
  listArrivals(date){ const d = normDate(date || 'heute'); if (!d) return fail('INVALID_DATE', 'Ungültiges Datum.'); return {ok:true, date:d, reservations: arrDepList('anreisen', d).map(resDTO)}; },
  listDepartures(date){ const d = normDate(date || 'heute'); if (!d) return fail('INVALID_DATE', 'Ungültiges Datum.'); return {ok:true, date:d, reservations: arrDepList('abreisen', d).map(resDTO)}; },
  listInhouse(){ return {ok:true, reservations: S.reservations.filter(r => r.status === 'angereist').map(resDTO)}; },
  checkIn(id, o){ return apiRun(true, () => { const x = checkInCore(id, Object.assign({signed:true}, o || {})); return x.ok ? {ok:true, reservation: resDTO(x.reservation)} : x; }); },
  checkOut(id){ return apiRun(true, () => { const x = checkOutCore(id); return x.ok ? {ok:true, invoiceNo:x.invoiceNo, reservation: resDTO(x.reservation)} : x; }); },
  addCharge(id, o){ return apiRun(true, () => addChargeCore(id, o || {})); },
  addPayment(id, o){ return apiRun(true, () => addPaymentCore(id, o || {})); },
  findGuest(query){ const r = searchAll(String(query || ''), 20); return {ok:true, count:r.guests.length, guests: r.guests.map(guestDTO)}; },
  getGuest(id){ const g = guest(id); return g ? {ok:true, guest: guestDTO(g), reservations: S.reservations.filter(r => r.guestId === g.id).map(resDTO)} : fail('GUEST_NOT_FOUND', 'Gast nicht gefunden.'); },
  createGuest(d){ return apiRun(true, () => { const x = createGuestCore(d || {}); return x.ok ? {ok:true, guest: guestDTO(x.guest)} : x; }); },
  updateGuest(id, d){ return apiRun(true, () => { const x = updateGuestCore(id, d || {}); return x.ok ? {ok:true, guest: guestDTO(x.guest)} : x; }); },
  listRooms(o){ o = o || {}; const T = todayISO(); return {ok:true, rooms: S.rooms.filter(r => (!o.status || r.hk === o.status) && (!o.category || r.category === catCode(o.category))).map(r => { const oc = roomOccupancyToday(r); return {roomNo:r.no, category:r.category, categoryName:CAT[r.category].name, floor:r.floor, status:r.hk, statusLabel:HK[r.hk].label, occupiedToday: !!oc.inh, freeTonight: isRoomFree(r.no, T, addDays(T, 1)), note:r.note, outOfOrderReason:r.oooReason || null, outOfOrderUntil:r.oooUntil}; })}; },
  setRoomStatus(no, status, o){ return apiRun(true, () => { const x = setRoomStatusCore(no, status, o); return x.ok ? {ok:true, room: clone(x.room)} : x; }); },
  listTasks(o){ o = o || {}; return {ok:true, tasks: clone(S.tasks.filter(t => o.open === undefined || t.done === !o.open))}; },
  createTask(o){ return apiRun(true, () => { const x = createTaskCore(o || {}); return x.ok ? {ok:true, task: clone(x.task)} : x; }); },
  getOccupancy(date){ const d = normDate(date || 'heute'); if (!d) return fail('INVALID_DATE', 'Ungültiges Datum.'); return {ok:true, date:d, available: availableOn(d), sold: soldOn(d), occupancyPct: round2(occupancy(d)), byCategory: CATEGORIES.map(c => ({category:c.code, free: catFreeOn(c.code, d)}))}; },
  reset(){ resetData(); render(); return {ok:true, reservations:S.reservations.length, guests:S.guests.length}; },
  /** Rohdaten (nur lesend, Kopie) */
  _state(){ return clone(S); }
};
window.hotelApi = hotelApi;

/* ---------- 10 Start ---------- */
applyTheme();
S = load();
bindEvents();
render();
})();
</script>
</body>
