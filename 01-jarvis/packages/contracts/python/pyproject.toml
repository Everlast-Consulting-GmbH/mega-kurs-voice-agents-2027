[project]
name = "jarvis-contracts"
version = "0.1.0"
description = "Generated Pydantic models for the Jarvis event and tool contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_contracts"]
