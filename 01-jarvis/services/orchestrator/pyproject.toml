[project]
name = "jarvis-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "jarvis-contracts", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1", "mcp>=1.26,<2", "claude-agent-sdk>=0.2.140,<0.3",
  "jsonschema>=4.23,<5", "json5>=0.12,<1", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.11"]

[project.scripts]
jarvis-orchestrator = "jarvis_orchestrator.app:main"

[tool.uv.sources]
jarvis-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: requires an API key and a running mock-world"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
