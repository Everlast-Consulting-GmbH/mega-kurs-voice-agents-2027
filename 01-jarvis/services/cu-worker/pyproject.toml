[project]
name = "jarvis-cu-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "jarvis-contracts", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "anthropic>=0.125,<1", "httpx>=0.28,<1", "playwright>=1.55,<2",
  "pillow>=11,<13", "python-dotenv>=1,<2",
]

[tool.uv.sources]
jarvis-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_cu_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["desktop: requires the Linux desktop container", "live: requires an Anthropic key and Praxis-App"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
