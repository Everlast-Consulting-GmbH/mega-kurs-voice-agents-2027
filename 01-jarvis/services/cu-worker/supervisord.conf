[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -ac -nolisten tcp
priority=10
autorestart=true

[program:openbox]
command=/bin/sh /app/services/cu-worker/scripts/desktop-start.sh wm
priority=20
autorestart=true

[program:chromium]
command=/bin/sh /app/services/cu-worker/scripts/desktop-start.sh browser
priority=30
autorestart=true
stopasgroup=true
killasgroup=true

[program:vnc]
command=/bin/sh /app/services/cu-worker/scripts/desktop-start.sh vnc
priority=40
autorestart=true

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
priority=50
autorestart=true

[program:worker]
command=uvicorn jarvis_cu_worker.app:app --host 0.0.0.0 --port 8800
priority=60
autorestart=true
stopwaitsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
